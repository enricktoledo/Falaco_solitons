name: Gerar FalacoSim.exe
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy matplotlib pyinstaller
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FalacoSim --hidden-import matplotlib.backends.backend_tkagg falaco_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: FalacoSim-windows
          path: dist/FalacoSim.exe
